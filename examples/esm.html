<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forcify · ES module</title>
<link rel="stylesheet" href="style.css">
<main>
  <h1>Press the ball</h1>
  <div class="ball" id="ball"></div>
  <output id="out">force 0.000</output>
</main>
<script type="module">
  import Forcify from '../dist/forcify.mjs'

  const out = document.getElementById('out')
  new Forcify('#ball')
    .on('force', (e) => (out.textContent = `force ${e.force.toFixed(3)} · ${e.source}`))
    .on('pop', () => (out.textContent += ' · pop!'))
</script>
